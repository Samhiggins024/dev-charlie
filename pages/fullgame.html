<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennis Tap</title>
    <link rel="stylesheet" href="../assets/styles/styles.css" />
  </head>
  <body>

    <nav>
      <h1>
        <i class="bi bi-circle-fill"></i>
        Tennis Tap
      </h1>

      <a href="../index.html"> Concept </a>

      <a href="../pages/fullgame.html"> Full Game </a> 

      <button
        class="btn btn-light"
        data-bs-toggle="modal"
        data-bs-target="#instructionsModal"
      >
        
      
    </nav>
    <div class="game-container">
      <h1>TENNIS TAP</h1>

      <div class="score">Score: <span id="score">0</span></div>

      <div id="home-screen">
        <button id="tap-button">TAP!</button>
        <p>Keep the balls off the ground!</p>
      </div>

      <canvas id="game-board" width="800" height="500"></canvas>

      <div id="game-over">
        <h2>GAME OVER!</h2>
        <p>Your score: <span id="final-score">0</span></p>
        <button id="restart-button">PLAY AGAIN</button>
      </div>

      <p class="instructions">
        Move your paddle with your mouse or the left and right arrow keys.
      </p>
    </div>
    <footer>
      <h3>Tennis Tap</h3>

      <a href="https://github.com/Samhiggins024/dev-charlie"> GitHub Repository </a>

      |

      <a href="https://github.com/Samhiggins024"> My GitHub </a>


      <p>© 2026 Tennis Tap</p>
    </footer>

    <script src="../assets/scripts/game-script.js"></script>
  </body>
</html>
